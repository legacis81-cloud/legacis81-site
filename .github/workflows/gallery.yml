name: Product gallery images (Etsy -> img/g)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pillow requests
      - name: Download and convert
        run: |
          python - <<'PY'
          import json, io, os, requests
          from PIL import Image
          src = json.load(open('data/gallery_sources.json'))
          os.makedirs('img/g', exist_ok=True)
          counts = []
          for i, items in enumerate(src):
              n = 0
              for it in items:
                  path, name = it.split('|')
                  u = f'https://i.etsystatic.com/65917698/r/il/{path}/il_fullxfull.{name}'
                  try:
                      im = Image.open(io.BytesIO(requests.get(u, timeout=30).content)).convert('RGB')
                  except Exception as e:
                      print('skip', i, u, e); continue
                  n += 1
                  im.thumbnail((800, 800), Image.LANCZOS)
                  im.save(f'img/g/{i:02d}_{n}.webp', 'WEBP', quality=82)
              counts.append(n)
          json.dump(counts, open('data/gallery_counts.json', 'w'))
          print(counts)
          PY
      - run: |
          git config user.name "legacis81-bot"
          git config user.email "legacis81@gmail.com"
          git add img/g data/gallery_counts.json
          git commit -m "Galerie produits : vues multiples depuis Etsy" || echo "nothing"
          git push
